# Build toolchain for the engine (bin/engine). Running the plugin needs none of it.
#   mise install        install the tools below
#   mise run build      rebuild bin/engine and bin/liball_smi_amd.so
[tools]
rust = "1.98.0"
protoc = "36.2"
"github:lablup/all-smi" = "0.27.1"
"github:EmbarkStudios/cargo-about" = "0.9.2"

[tasks.build]
description = "Build bin/engine and copy the AMD companion library beside it"
run = "scripts/build-engine.sh"

[tasks.version]
description = "Set the manifest.json version, commit it and tag it (mise run version 1.2.0)"
usage = 'arg "<version>" help="New version, e.g. 1.2.0"'
run = 'scripts/version.sh {{usage.version}}'

[tasks.licenses]
description = "Regenerate licenses/THIRD-PARTY.txt from the crates linked into bin/engine"
run = "cargo about generate --locked --fail -m engine/Cargo.toml engine/about.hbs -o licenses/THIRD-PARTY.txt"

[tasks.snapshot]
description = "Print one snapshot from bin/engine"
run = "bin/engine --once | jq ."

[tasks.bench]
description = "Measure the running plugin's CPU, memory and wakeups (mise run bench -- 60 for 60 s)"
run = "scripts/bench.sh"

[tasks.validate]
description = "Validate the plugin manifest"
run = "omarchy plugin validate ."
