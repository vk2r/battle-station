# Checks that the bundled binaries in bin/ are the ones built by build-engine.yml:
# the checksums match, each file has a build provenance attestation signed by that
# workflow, and the source it was built from has the same engine code as this commit.
name: Verify binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checksums
        run: cd bin && sha256sum -c SHA256SUMS

      - name: Attestations and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # What the binaries are built from; they must not be older than these.
          sources=(engine mise.toml scripts/build-engine.sh)
          for file in bin/engine bin/liball_smi_amd.so; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-engine.yml" \
              --format json > attestations.json
            matched=0
            # A file can have several attestations (one per build that produced it).
            for commit in $(jq -r '.. | .sourceRepositoryDigest? // empty' attestations.json | sort -u); do
              same=1
              for path in "${sources[@]}"; do
                [[ "$(git rev-parse "$commit:$path" 2>/dev/null)" == "$(git rev-parse "HEAD:$path")" ]] || same=0
              done
              if [[ $same == 1 ]]; then
                echo "$file: built from $commit, same sources as HEAD"
                matched=1
                break
              fi
            done
            if [[ $matched == 0 ]]; then
              echo "::error::$file was not built from the current engine sources"
              exit 1
            fi
          done
