# Builds bin/engine and bin/liball_smi_amd.so from the exact commit, with the
# toolchain pinned in mise.toml, attests their build provenance and commits them
# to main with the signed attestation (bin/provenance.sigstore.json). It runs when
# the engine sources change, or by hand on main, and then starts Verify binaries.
name: Build engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "mise.toml"
      - "scripts/build-engine.sh"
      - ".github/workflows/build-engine.yml"

# One build at a time, so two runs never race to push bin/.
concurrency:
  group: build-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # commit the binaries to main
      actions: write       # start Verify binaries on the new commit
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: true
          cache: false

      - name: Build
        run: mise run build

      - name: Checksums
        run: cd bin && sha256sum engine liball_smi_amd.so | tee SHA256SUMS

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/engine
            bin/liball_smi_amd.so

      - name: Keep the signed attestation
        run: cp "${{ steps.attest.outputs.bundle-path }}" bin/provenance.sigstore.json

      - name: Commit binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/engine bin/liball_smi_amd.so bin/SHA256SUMS bin/provenance.sigstore.json
          if git diff --cached --quiet; then
            echo "Binaries unchanged."
            exit 0
          fi
          git commit -m "🤖 build binaries from ${GITHUB_SHA::7}" \
            -m "Built by .github/workflows/build-engine.yml (run $GITHUB_RUN_ID) from $GITHUB_SHA."
          git pull --rebase origin main
          git push origin HEAD:main
          # A push made with GITHUB_TOKEN triggers no workflow, so start the check by hand.
          gh workflow run verify-binaries.yml --ref main
