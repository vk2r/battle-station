[package]
name = "llama-engine"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
# Pinned: bin/liball_smi_amd.so must come from the same all-smi release (see mise.toml).
all-smi = { version = "=0.27.1", default-features = false }
regex = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "unwind"
